<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>邀请码汇总 · 机场 & AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0b0d12;
      --bg-soft: #11141c;
      --card: #161a24;
      --border: #232838;
      --text: #e6e8ee;
      --muted: #8a90a0;
      --accent: #7c5cff;
      --accent-2: #22d3ee;
      --accent-ai: #f472b6;
      --radius: 14px;
      --shadow: 0 10px 30px rgba(0,0,0,.35);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background:
        radial-gradient(1200px 600px at 10% -10%, rgba(124,92,255,.18), transparent 60%),
        radial-gradient(900px 500px at 100% 0%, rgba(34,211,238,.12), transparent 60%),
        var(--bg);
      color: var(--text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    .container {
      max-width: 1080px;
      margin: 0 auto;
      padding: 64px 24px 96px;
    }
    header {
      text-align: center;
      margin-bottom: 56px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      background: rgba(124,92,255,.12);
      border: 1px solid rgba(124,92,255,.3);
      border-radius: 999px;
      font-size: 12px;
      color: #b9a9ff;
      letter-spacing: .04em;
      margin-bottom: 18px;
    }
    .badge .dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 10px var(--accent);
    }
    h1 {
      font-size: 44px;
      line-height: 1.1;
      margin: 0 0 14px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    h1 .grad {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .subtitle {
      color: var(--muted);
      font-size: 16px;
      max-width: 560px;
      margin: 0 auto;
    }
    .section-title {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 22px;
      font-weight: 600;
      margin: 48px 0 20px;
    }
    .section-title .icon {
      width: 36px; height: 36px;
      display: inline-flex; align-items: center; justify-content: center;
      border-radius: 10px;
      font-size: 18px;
    }
    .section-title.airport .icon { background: rgba(124,92,255,.15); color: var(--accent); }
    .section-title.ai .icon { background: rgba(244,114,182,.15); color: var(--accent-ai); }
    .section-title .count {
      margin-left: auto;
      font-size: 12px;
      color: var(--muted);
      background: var(--bg-soft);
      border: 1px solid var(--border);
      padding: 4px 10px;
      border-radius: 999px;
      font-weight: 500;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 18px;
    }
    .card {
      background: linear-gradient(180deg, rgba(255,255,255,.02), transparent), var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 22px;
      box-shadow: var(--shadow);
      transition: transform .2s ease, border-color .2s ease;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .card:hover {
      transform: translateY(-2px);
      border-color: rgba(124,92,255,.45);
    }
    .card.ai-card:hover { border-color: rgba(244,114,182,.45); }
    .card-head {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .logo {
      width: 44px; height: 44px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      display: inline-flex; align-items: center; justify-content: center;
      font-weight: 700;
      color: #fff;
      font-size: 18px;
      flex-shrink: 0;
    }
    .card.ai-card .logo { background: linear-gradient(135deg, var(--accent-ai), #fb923c); }
    .card-name {
      font-size: 17px;
      font-weight: 600;
    }
    .card-desc {
      font-size: 13px;
      color: var(--muted);
      margin-top: 2px;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: var(--bg-soft);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
    }
    .row .label {
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .08em;
      margin-bottom: 2px;
    }
    .row .value {
      font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 14px;
      color: var(--text);
      user-select: all;
    }
    .copy-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 12px;
      padding: 6px 10px;
      border-radius: 8px;
      cursor: pointer;
      transition: all .15s ease;
    }
    .copy-btn:hover { color: var(--text); border-color: var(--accent); }
    .copy-btn.copied { color: #34d399; border-color: #34d399; }
    .actions {
      display: flex;
      gap: 10px;
      margin-top: auto;
    }
    .btn {
      flex: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 500;
      text-decoration: none;
      transition: all .15s ease;
      border: 1px solid var(--border);
      color: var(--text);
      background: var(--bg-soft);
    }
    .btn:hover { border-color: var(--accent); color: var(--text); }
    .btn-primary {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      border-color: transparent;
      color: #fff;
    }
    .btn-primary:hover { filter: brightness(1.08); }
    .empty {
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      padding: 32px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
    }
    footer {
      margin-top: 80px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }
    footer a { color: var(--muted); text-decoration: none; border-bottom: 1px dashed var(--border); }
    footer a:hover { color: var(--text); }
    @media (max-width: 600px) {
      h1 { font-size: 32px; }
      .container { padding: 40px 18px 64px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <span class="badge"><span class="dot"></span>Invite Codes Hub</span>
      <h1>各大平台 <span class="grad">邀请码</span> 汇总</h1>
      <p class="subtitle">精选机场与 AI 服务的邀请码与注册链接，点击卡片即可直接跳转注册。</p>
    </header>

    <div class="section-title airport">
      <span class="icon">✈️</span> 机场
      <span class="count">1 个</span>
    </div>
    <div class="grid">

      <div class="card">
        <div class="card-head">
          <div class="logo">悠</div>
          <div>
            <div class="card-name">悠兔</div>
            <div class="card-desc">高速稳定的节点机场</div>
          </div>
        </div>
        <div class="row">
          <div>
            <div class="label">邀请码</div>
            <div class="value" id="code-0">NfZAyfPo</div>
          </div>
          <button class="copy-btn" data-copy="code-0">复制</button>
        </div>
        <div class="actions">
          <a class="btn btn-primary" href="https://youtunice.com/?path=register&code=NfZAyfPo" target="_blank" rel="noopener">使用邀请码注册 →</a>
        </div>
      </div>

    </div>

    <div class="section-title ai">
      <span class="icon">🤖</span> AI
      <span class="count">0 个</span>
    </div>
    <div class="grid">
      <div class="empty">暂无收录，欢迎补充 ✨</div>
    </div>

    <footer>
      <p>由 <a href="https://github.com/2754LM/invite-codes" target="_blank" rel="noopener">2754LM/invite-codes</a> 维护 · 使用 GitHub Pages 部署</p>
    </footer>
  </div>

  <script>
    document.querySelectorAll('.copy-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        const id = btn.getAttribute('data-copy');
        const text = document.getElementById(id)?.textContent?.trim();
        if (!text) return;
        try {
          await navigator.clipboard.writeText(text);
        } catch {
          const ta = document.createElement('textarea');
          ta.value = text;
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          ta.remove();
        }
        const orig = btn.textContent;
        btn.textContent = '已复制';
        btn.classList.add('copied');
        setTimeout(() => { btn.textContent = orig; btn.classList.remove('copied'); }, 1400);
      });
    });
  </script>
</body>
</html>
